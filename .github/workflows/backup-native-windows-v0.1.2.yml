name: Exact-tag Backup native Windows acceptance
on:
  push:
    branches: [qa/backup-native-windows-v0.1.2-20261021]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: qa-routing
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 2c07902c8d9b7ddd6f5db4b1f939f5971ffc702b
          path: tag-source
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Verify exact frozen transport inputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = Join-Path $env:GITHUB_WORKSPACE 'qa-routing/.github/qa/backup-native-v0.1.2'
          if ((Get-FileHash (Join-Path $base 'bootstrap.py') -Algorithm SHA256).Hash.ToLowerInvariant() -ne '7aa7afa80871f7cad2e008060a35eeb7c71447f5a51ab794ba718ba6052d4f0b') { throw 'Bootstrap hash mismatch' }
          if ((Get-FileHash (Join-Path $base 'run_backup_native.py.txt') -Algorithm SHA256).Hash.ToLowerInvariant() -ne '288526a0582a67c0ff59af1c512778326b8200dc2603e0270c69bef2d8fff7b2') { throw 'Runner hash mismatch' }
          if ((Get-FileHash (Join-Path $base 'routing.json') -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'a213c825d83885d8739ecad56b27466b9edb6a1f7bafa8990d662654e44506c2') { throw 'Routing hash mismatch' }
      - name: Download exact existing official tag artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -I -B qa-routing/.github/qa/backup-native-v0.1.2/bootstrap.py download
      - name: Execute genuine native preflight and unchanged installed acceptance
        shell: pwsh
        run: python -I -B qa-routing/.github/qa/backup-native-v0.1.2/bootstrap.py run
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: backup-native-windows-${{ matrix.python }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/backup-native-*/DOWNLOAD.json
            ${{ runner.temp }}/backup-native-*/PREFLIGHT.json
            ${{ runner.temp }}/backup-native-*/acceptance/RESULT.json
            ${{ runner.temp }}/backup-native-*/acceptance/artifact-*/*.xml
            ${{ runner.temp }}/backup-native-*/acceptance/artifact-*/*.log
